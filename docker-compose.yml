version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: carf-chorf
    environment:
      POSTGRES_DB: carf-chorf
      POSTGRES_USER: carf-chorf
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_carf-chorf_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carf-chorf"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_carf-chorf_db: