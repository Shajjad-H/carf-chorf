{% extends "layouts/base.html" %}

{% block title %}Get started{% endblock %}

{% block content %}
<section class="relative isolate">
  <div aria-hidden="true" class="pointer-events-none absolute inset-x-0 -top-24 -z-10 flex justify-center overflow-hidden blur-3xl">
    <div class="aspect-[1108/632] w-[69.25rem] flex-none bg-gradient-to-r from-indigo-200 via-sky-200 to-emerald-200 opacity-40"></div>
  </div>

  <div class="mx-auto max-w-md">
    <div class="text-center">
      <p class="text-xs font-semibold uppercase tracking-[0.2em] text-indigo-600">Create your account</p>
      <h1 class="mt-4 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">Get started</h1>
      <p class="mt-3 text-sm leading-6 text-slate-600">Enter your email and we'll send you a one-time code.</p>
    </div>

    <div class="mt-8 rounded-3xl border border-slate-200/70 bg-white/80 p-6 shadow-xl shadow-slate-200/60 backdrop-blur sm:p-8">
      <form method="POST" action="/getstarted" class="space-y-5">
        {% include "components/forms/csrf.html" %}
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required value="{{ email }}"
            placeholder="you@example.com"
            class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10" />
        </div>

        <button type="submit"
          class="inline-flex w-full items-center justify-center rounded-xl bg-gradient-to-r from-indigo-600 to-sky-500 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-500/20 transition hover:from-indigo-500 hover:to-sky-400 focus:outline-none focus:ring-4 focus:ring-indigo-500/30">
          Send code
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        Already have an account?
        <a href="/login" class="font-medium text-indigo-600 transition hover:text-indigo-500">Login</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}
