<div x-show="loginOpen" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/40 p-4 backdrop-blur-sm">
  <div class="w-full max-w-md rounded-[2rem] bg-gradient-to-br from-indigo-500/30 via-sky-400/20 to-emerald-400/30 p-px shadow-2xl shadow-indigo-500/20">
    <div class="rounded-[calc(2rem-1px)] bg-white p-6 sm:p-8">
      <span class="inline-flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-50 via-sky-50 to-emerald-50 text-indigo-600 ring-1 ring-indigo-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
      </span>
      <p class="mt-4 text-xs font-semibold uppercase tracking-[0.2em] text-indigo-600">Account required</p>
      <h2 class="mt-2 text-2xl font-bold tracking-tight text-slate-900">Log in to buy 2 or 4 credits</h2>
      <p class="mt-3 text-sm leading-6 text-slate-600">
        Multi-credit packages are saved to your account so you can use them whenever you are ready.
      </p>
      <div class="mt-6 flex flex-col gap-3">
        <button type="button" @click="goLogin()"
          class="inline-flex items-center justify-center rounded-xl bg-gradient-to-r from-indigo-600 to-sky-500 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-500/20 transition hover:from-indigo-500 hover:to-sky-400">
          Log in
        </button>
        <button type="button" @click="goGetStarted()"
          class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-6 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">
          Create account
        </button>
        <button type="button" @click="loginOpen = false"
          class="mt-1 text-sm font-medium text-slate-500 transition hover:text-slate-700">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
