<div class="relative">
  {% if p.Badge %}
  <span class="absolute -top-2.5 left-4 z-10 rounded-full px-2.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-white shadow-sm {{ badge_class }}">{{ p.Badge }}</span>
  {% endif %}

  <button type="button" @click="selectPackage({{ p.Credits }})"
    class="relative h-full w-full rounded-2xl border p-4 text-left transition focus:outline-none focus:ring-4 {{ focus_class }}"
    :class="selected === {{ p.Credits }} ? '{{ selected_class }}' : '{{ unselected_class }}'">
    {% include "components/checkout/package_option.html" %}
    <span class="mt-3 inline-flex items-center gap-1.5 text-xs font-semibold {{ action_class }}">
      <span x-text="packageActionLabel({{ p.Credits }})">Select package</span>
    </span>
  </button>
</div>
