<span class="block pr-9">
  <span class="block text-sm font-semibold {{ name_class }}">{{ p.Name }}</span>
  <span class="mt-2 block text-2xl font-bold tracking-tight text-slate-900">{{ p.Price }}</span>
  <span class="mt-2 flex flex-wrap items-center gap-2 text-xs text-slate-500">
    <span>{{ p.PerCredit }} per credit</span>
    {% if p.Savings %}
    <span class="inline-flex items-center rounded-full px-2 py-0.5 font-semibold {{ savings_class }}">{{ p.Savings }}</span>
    {% endif %}
  </span>
</span>
<span class="absolute right-4 top-4 inline-flex h-6 w-6 flex-none items-center justify-center rounded-full border-2 transition"
  :class="selected === {{ p.Credits }} ? '{{ check_selected_class }} text-white' : 'border-slate-300 bg-white text-transparent'">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="m20 6-11 11-5-5" />
  </svg>
</span>
<span class="mt-3 block text-sm leading-6 text-slate-600">{{ p.Description }}</span>
