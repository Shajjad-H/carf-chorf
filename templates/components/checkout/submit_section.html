<div class="border-t border-slate-100 bg-gradient-to-r from-indigo-50/60 via-sky-50/40 to-emerald-50/60 px-6 py-6 sm:px-8">
  <button type="submit" :disabled="selected === 0 || !termsAccepted || submitting"
    class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-indigo-600 via-sky-500 to-emerald-500 px-6 py-3.5 text-sm font-semibold text-white shadow-lg shadow-indigo-500/25 transition hover:from-indigo-500 hover:via-sky-400 hover:to-emerald-400 focus:outline-none focus:ring-4 focus:ring-indigo-500/30 disabled:cursor-not-allowed disabled:opacity-60">
    <svg x-show="submitting" x-cloak class="h-4 w-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8V0C5.4 0 0 5.4 0 12h4Z"></path>
    </svg>
    <svg x-show="!submitting" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" />
      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
    </svg>
    <span x-show="!submitting">Continue to payment</span>
    <span x-show="submitting" x-cloak>Creating transaction...</span>
  </button>
  <p class="mt-3 text-center text-xs text-slate-500">Secure checkout · PayPal</p>
</div>
