<div id="terms-box" class="card scroll-mt-24 p-5 sm:p-6">
  <label class="flex cursor-pointer items-start gap-3 rounded-2xl border-2 p-4 text-sm text-ink-700 transition"
    :class="termsAccepted ? 'border-emerald-300 bg-emerald-50/60' : 'border-line bg-soft/50 hover:border-brand-200'">
    <input id="terms" type="checkbox" name="terms" x-model="termsAccepted" required class="peer sr-only" />
    <span class="mt-px inline-flex h-6 w-6 flex-none items-center justify-center rounded-md border-2 transition peer-focus-visible:ring-4 peer-focus-visible:ring-brand-500/20"
      :class="termsAccepted ? 'border-emerald-500 bg-emerald-500 text-white' : 'border-ink-300 bg-white text-transparent'">
      <iconify-icon icon="ph:check-bold" class="block h-3.5 w-3.5" aria-hidden="true"></iconify-icon>
    </span>
    <span class="min-w-0">
      <span class="block font-medium leading-6 text-ink-900">
        I agree to the
        <a href="/terms" target="_blank" rel="noopener" @click.stop class="font-semibold text-brand-700 underline underline-offset-2 transition hover:text-brand-600">Terms of Service</a>
        and
        <a href="/cgv" target="_blank" rel="noopener" @click.stop class="font-semibold text-brand-700 underline underline-offset-2 transition hover:text-brand-600">Terms of Sale</a>.
      </span>
    </span>
  </label>
</div>
