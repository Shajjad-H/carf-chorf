<header class="sticky top-0 z-30 border-b border-slate-200/70 bg-white/80 backdrop-blur">
  <div class="mx-auto flex max-w-5xl items-center gap-6 px-4 py-3">
    <a href="/" class="flex items-center gap-2">
      <img src="/public/logo-original-compressed.png" alt="Carf Chorf" class="h-8 w-auto" />
    </a>
    <nav class="ml-auto flex items-center gap-1 text-sm font-medium text-slate-600">
      <a href="/" class="rounded-lg px-3 py-2 transition hover:bg-slate-100 hover:text-slate-900">Home</a>
      <a href="/pricing" class="rounded-lg px-3 py-2 transition hover:bg-slate-100 hover:text-slate-900">Pricing</a>
      <a href="/contact" class="rounded-lg px-3 py-2 transition hover:bg-slate-100 hover:text-slate-900">Contact</a>
      {% if authenticated %}
      <form method="POST" action="/logout" class="inline">
        {% include "components/forms/csrf.html" %}
        <button type="submit" class="rounded-lg px-3 py-2 transition hover:bg-slate-100 hover:text-slate-900">Logout</button>
      </form>
      {% else %}
      <a href="/login" class="rounded-lg px-3 py-2 transition hover:bg-slate-100 hover:text-slate-900">Login</a>
      <a href="/getstarted" class="rounded-lg bg-slate-900 px-3 py-2 text-white transition hover:bg-slate-700">Get started</a>
      {% endif %}
    </nav>
  </div>
</header>
