<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{% block title %}Carf Chorf{% endblock %}</title>
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; width: 100% !important; background-color: #f1f5f9; }
    a { color: #4f46e5; }
    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; }
      .email-padding { padding-left: 24px !important; padding-right: 24px !important; }
      .email-hero { padding: 30px 24px 8px !important; }
      .email-code { font-size: 30px !important; letter-spacing: 6px !important; }
      .email-cta { width: 100% !important; }
      .email-stack { display: block !important; width: 100% !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;">
  <div style="display:none;font-size:1px;color:#f1f5f9;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">{{ preheader }}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f5f9;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;">
          <tr>
            <td style="padding:0 0 20px;text-align:center;">
              <a href="{{ domain }}" style="text-decoration:none;">
                <img src="{{ logo_url }}" width="132" alt="Carf Chorf" style="display:inline-block;width:132px;max-width:132px;height:auto;">
              </a>
            </td>
          </tr>

          <tr>
            <td style="background-color:#ffffff;border:1px solid #e2e8f0;border-radius:20px;overflow:hidden;box-shadow:0 18px 40px rgba(15,23,42,0.08);">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="height:6px;background-color:#4f46e5;font-size:0;line-height:0;">&nbsp;</td>
                </tr>
                <tr>
                  <td class="email-hero email-padding" style="padding:40px 44px 8px;">
                    <p style="margin:0 0 12px;color:#6366f1;font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;">{% block eyebrow %}Carf Chorf{% endblock %}</p>
                    <h1 style="margin:0;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:30px;line-height:38px;font-weight:700;letter-spacing:-0.02em;">{% block heading %}Your vehicle history, simplified{% endblock %}</h1>
                  </td>
                </tr>
                <tr>
                  <td class="email-padding" style="padding:20px 44px 40px;color:#475569;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:26px;">
                    {% block content %}{% endblock %}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td class="email-padding" style="padding:24px 20px 8px;text-align:center;color:#64748b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:20px;">
              <p style="margin:0 0 8px;font-weight:600;color:#475569;">{{ brand_name }} · Vehicle history reports</p>
              <p style="margin:0 0 8px;">
                <a href="{{ contact_url }}" style="color:#64748b;text-decoration:underline;">Contact</a>
                <span style="color:#cbd5e1;">&nbsp;·&nbsp;</span>
                <a href="{{ pricing_url }}" style="color:#64748b;text-decoration:underline;">Pricing</a>
                <span style="color:#cbd5e1;">&nbsp;·&nbsp;</span>
                <a href="{{ terms_url }}" style="color:#64748b;text-decoration:underline;">Terms</a>
              </p>
              <p style="margin:0;">Sent to {{ to }} · © {{ year }} {{ brand_name }}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
