{% extends "layouts/base.html" %}

{% block title %}Payment complete{% endblock %}

{% block content %}
<section class="relative isolate">
  <div class="mx-auto max-w-2xl">
    <div class="rounded-3xl border border-emerald-200/70 bg-white/80 p-8 text-center shadow-xl shadow-emerald-100/60 backdrop-blur sm:p-10">
      <span class="inline-flex h-14 w-14 items-center justify-center rounded-full bg-emerald-50 text-emerald-600 ring-1 ring-emerald-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5" />
        </svg>
      </span>
      <h1 class="mt-5 text-3xl font-bold tracking-tight text-slate-900">Payment complete</h1>
      <p class="mt-3 text-sm leading-6 text-slate-600">
        {{ credits }} credit{% if credits != 1 %}s{% endif %} have been added to {{ email }}.
      </p>

      <div class="mt-6 rounded-2xl border border-slate-200 bg-slate-50/70 p-5 text-left text-sm">
        <div class="flex items-center justify-between">
          <span class="text-slate-500">Amount paid</span>
          <span class="font-semibold text-slate-900">{{ amount }}</span>
        </div>
      </div>

      <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-center">
        <a href="/pricing" class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-5 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">
          View pricing
        </a>
        <a href="/" class="inline-flex items-center justify-center rounded-xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-500/20 transition hover:bg-indigo-500">
          Start a vehicle lookup
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
